<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Teste Burguer Gold</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body style="background:#111;color:white;font-family:Arial;padding:30px">

  <h1>Burguer Gold</h1>

  <div id="resultado">Testando conexão...</div>

  <script>
    const SUPABASE_URL =
      "https://xmxacmfzwrvrrmayivph.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_9sCek2Z6B0H-B3DTfIb5lA_eyN4wESC";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function testar(){

      const resultado =
        document.getElementById("resultado");

      try {

        const { data, error } = await db
          .from("products")
          .select("id,name,price")
          .eq("available", true);

        if(error){
          throw error;
        }

        if(!data || data.length === 0){

          resultado.innerHTML =
            "<h2>Conexão OK, mas nenhum produto encontrado.</h2>";

          return;
        }

        resultado.innerHTML = `
          <h2>✅ CONEXÃO FUNCIONANDO!</h2>
          <p>Produtos encontrados:</p>

          <ul>
            ${data.map(p => `
              <li>
                ${p.name} -
                R$ ${Number(p.price)
                  .toFixed(2)
                  .replace(".",",")}
              </li>
            `).join("")}
          </ul>
        `;

      } catch(error){

        console.error(error);

        resultado.innerHTML = `
          <h2>❌ ERRO</h2>
          <pre style="white-space:pre-wrap">
${error.message || error}
          </pre>
        `;

      }

    }

    testar();
  </script>

</body>
</html>
